x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/Dockerfile.airflow
  depends_on:
    postgres:
      condition: service_healthy
  environment: &airflow_env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://crypto:crypto@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=
    AIRFLOW__WEBSERVER__SECRET_KEY: my_super_secret_key_12345
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/log
    AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: 8793
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
    REDIS_HOST: redis
    REDIS_PORT: 6379
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: crypto
    POSTGRES_PASSWORD: crypto
    POSTGRES_DB: crypto_data
  volumes:
    - ./dags:/opt/airflow/dags
    - ./storage:/opt/airflow/storage
    - ./processing:/opt/airflow/processing
    - ./ingestion:/opt/airflow/ingestion
    - ./util:/opt/airflow/util
    - ./ml:/opt/airflow/ml
    - ./log:/opt/airflow/log
    - spark-checkpoints:/opt/airflow/data/spark-checkpoints
    - ./schema:/opt/airflow/schema
  logging: *default-logging

services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE
  # ---------------------------------------------------------------------------

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_COMPRESSION_TYPE: snappy
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  schema-registry:
    image: ghcr.io/aiven-open/karapace:develop
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    entrypoint: ["python3", "-m", "karapace"]
    environment:
      KARAPACE_KARAPACE_REGISTRY: "true"
      KARAPACE_ADVERTISED_HOSTNAME: schema-registry
      KARAPACE_BOOTSTRAP_URI: kafka:29092
      KARAPACE_PORT: 8081
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_CLIENT_ID: karapace
      KARAPACE_GROUP_ID: karapace-registry
      KARAPACE_MASTER_ELIGIBILITY: "true"
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_LOG_LEVEL: WARNING
      KARAPACE_COMPATIBILITY: BACKWARD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging

  schema-init:
    image: curlimages/curl:latest
    container_name: schema-init
    depends_on:
      schema-registry:
        condition: service_healthy
    volumes:
      - ./schema:/app/schema:ro
      - ./script:/app/script:ro
    entrypoint: ["/bin/sh", "-c", "sleep 30 && /bin/sh /app/script/register_schema.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: postgres
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_data
    ports:
      - "5433:5432"  # Host 5433 -> Container 5432 (tránh conflict với PostgreSQL local)
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./script/init_schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "crypto"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c shared_buffers=128MB -c max_connections=100 -c shared_preload_libraries=timescaledb
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # APPLICATION
  # ---------------------------------------------------------------------------

  crypto-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: crypto-api
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_DATA_HOST: postgres
      POSTGRES_DATA_PORT: 5432
      POSTGRES_DATA_USER: crypto
      POSTGRES_DATA_PASSWORD: crypto
      POSTGRES_DATA_DB: crypto_data
      MODEL_DIR: /app/ml/model
    volumes:
      - ./api:/app/api
      - ./storage:/app/storage
      - ./util:/app/util
      - ./data:/app/data
      - ./ml:/app/ml
      - ./schema:/app/schema
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *default-logging

  ticker-consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    container_name: ticker-consumer
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TICKER_TOPIC: raw_tickers
      TICKER_CONSUMER_GROUP: ticker-consumer-group
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: INFO
    volumes:
      - ./ingestion:/app/ingestion
      - ./storage:/app/storage
      - ./util:/app/util
      - ./schema:/app/schema
    command: python -c "from ingestion.ticker_consumer import main; main()"
    healthcheck:
      test: ["CMD", "python", "-c", "from ingestion.ticker_consumer import health_check_main; exit(health_check_main())"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  trade-consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    container_name: trade-consumer
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    environment:
      KAFKA_SERVER: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: INFO
    volumes:
      - ./ingestion:/app/ingestion
      - ./storage:/app/storage
      - ./util:/app/util
      - ./schema:/app/schema
    command: python -m ingestion.trade_consumer
    restart: unless-stopped
    logging: *default-logging

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: streamlit
    depends_on:
      crypto-api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      API_URL: http://crypto-api:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # ORCHESTRATION (AIRFLOW)
  # ---------------------------------------------------------------------------

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    environment:
      <<: *airflow_env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true
        airflow connections add 'spark_default' --conn-type 'spark' --conn-host 'local' --conn-extra '{"queue": "root.default", "deploy-mode": "client"}' || true
        airflow variables set kafka_bootstrap_servers "kafka:9092" || true
        airflow variables set redis_host "redis:6379" || true
        airflow variables set postgres_host "postgres" || true
        airflow variables set postgres_port "5432" || true
        echo "Airflow initialization complete!"
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow_env
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__WEBSERVER__RBAC: 'true'
    ports:
      - "8080:8080"
    command: airflow webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow_env
      AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net:getfqdn
    command: airflow scheduler
    ports:
      - "8793:8793"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MONITORING
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.size=500MB'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      crypto-api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: redis-datasource,marcusolsson-json-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: redis-datasource
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-storage:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis:6379
    logging: *default-logging

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:29092'
      - '--web.listen-address=:9308'
    logging: *default-logging

volumes:
  postgres-data:
  grafana-storage:
  prometheus-data:
  spark-checkpoints:

networks:
  default:
    driver: bridge
