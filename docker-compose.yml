services:
  # Zookeeper - Required for Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms128M"
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_COMPRESSION_TYPE: ${KAFKA_COMPRESSION:-snappy}
      KAFKA_HEAP_OPTS: "-Xmx384M -Xms256M"
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Karapace - Lightweight Schema Registry (Confluent API compatible)
  # ~200MB image vs ~1.4GB Confluent, same API
  schema-registry:
    image: ghcr.io/aiven-open/karapace:develop
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    entrypoint:
      - python3
      - -m
      - karapace
    environment:
      KARAPACE_KARAPACE_REGISTRY: "true"
      KARAPACE_ADVERTISED_HOSTNAME: schema-registry
      KARAPACE_BOOTSTRAP_URI: kafka:29092
      KARAPACE_PORT: 8081
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_CLIENT_ID: karapace
      KARAPACE_GROUP_ID: karapace-registry
      KARAPACE_MASTER_ELIGIBILITY: "true"
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_LOG_LEVEL: WARNING
      KARAPACE_COMPATIBILITY: BACKWARD
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 64M

  # Redis - Hot cache for real-time data
  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 64M

  # PostgreSQL - Airflow metadata database
  postgres:
    image: postgres:14-alpine
    hostname: postgres
    container_name: airflow-postgres
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PGTZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    ports:
      - "${AIRFLOW_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c shared_buffers=64MB -c max_connections=50
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  postgres-data:
    image: timescale/timescaledb:latest-pg14
    hostname: postgres-data
    container_name: postgres-data
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      PGTZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_data}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data-volume:/var/lib/postgresql/data
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-crypto}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c shared_buffers=64MB -c max_connections=50 -c shared_preload_libraries=timescaledb
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M


  # Airflow Init - One-time initialization
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: airflow-init
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./storage:/opt/airflow/storage
      - ./processing:/opt/airflow/processing
      - ./util:/opt/airflow/util
      - ./validator:/opt/airflow/validator
      - ./data:/opt/airflow/data
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init
        airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --firstname Admin --lastname User --role Admin --email admin@example.com --password ${AIRFLOW_ADMIN_PASSWORD:-admin} || true
        airflow connections add 'spark_default' --conn-type 'spark' --conn-host 'local' --conn-extra '{"queue": "root.default", "deploy-mode": "client"}' || true
        airflow variables set kafka_bootstrap_servers "kafka:29092" || true
        airflow variables set redis_host "redis:${REDIS_PORT:-6379}" || true
        airflow variables set postgres_data_host "postgres-data" || true
        airflow variables set postgres_data_port "5432" || true
        echo "Airflow initialization complete!"
    networks:
      - streaming-network
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M


  # Airflow Webserver
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: airflow-webserver
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      AIRFLOW__CORE__DEFAULT_TIMEZONE: ${TIMEZONE:-Asia/Ho_Chi_Minh}
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: ${TIMEZONE:-Asia/Ho_Chi_Minh}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: 'true'
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/dags/logs
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      AIRFLOW__WEBSERVER__RBAC: 'true'
      AIRFLOW__WEBSERVER__WORKERS: '1'
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      POSTGRES_HOST: postgres-data
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_data}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./storage:/opt/airflow/storage
      - ./processing:/opt/airflow/processing
      - ./util:/opt/airflow/util
      - ./validator:/opt/airflow/validator
      - ./data:/opt/airflow/data
    command: airflow webserver
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M


  # Airflow Scheduler
  # Note: Runs Spark jobs as subprocesses, needs more memory
  # Spark jobs use 512m executor + 512m driver = ~1GB per job
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: airflow-scheduler
    container_name: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      AIRFLOW__CORE__DEFAULT_TIMEZONE: ${TIMEZONE:-Asia/Ho_Chi_Minh}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: 30
      AIRFLOW__CORE__ENABLE_XCOM_PICKLING: 'true'
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/dags/logs
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      POSTGRES_HOST: postgres-data
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
      POSTGRES_DB: ${POSTGRES_DB:-crypto_data}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./storage:/opt/airflow/storage
      - ./processing:/opt/airflow/processing
      - ./ingestion:/opt/airflow/ingestion
      - ./util:/opt/airflow/util
      - ./validator:/opt/airflow/validator
      - spark-checkpoints:/opt/airflow/data/spark-checkpoints
      # /app mounts for BashOperator commands
      - ./ingestion:/app/ingestion
      - ./processing:/app/processing
      - ./storage:/app/storage
      - ./util:/app/util
      - ./schema:/app/schema
      - ./validator:/app/validator
    command: airflow scheduler
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: '2.5'
          memory: 1800M
        reservations:
          cpus: '1.0'
          memory: 768M


  # Redis Exporter - Export Redis metrics to Prometheus
  redis-exporter:
    image: oliver006/redis_exporter:latest
    hostname: redis-exporter
    container_name: redis-exporter
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis:6379
    networks:
      - streaming-network
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # Kafka Exporter - Export Kafka metrics to Prometheus
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    hostname: kafka-exporter
    container_name: kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"
    command:
      - '--kafka.server=kafka:29092'
      - '--web.listen-address=:9308'
    networks:
      - streaming-network
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  # Prometheus - Metrics collection and monitoring
  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.size=500MB'
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M

  # Crypto Data API - FastAPI REST API
  crypto-api:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: crypto-api
    container_name: crypto-api
    depends_on:
      redis:
        condition: service_healthy
      postgres-data:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      PARQUET_PATH: /app/data/parquet
      POSTGRES_DATA_HOST: postgres-data
      POSTGRES_DATA_PORT: '5432'
      POSTGRES_DATA_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_DATA_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
      POSTGRES_DATA_DB: ${POSTGRES_DB:-crypto_data}
    volumes:
      - ./api:/app/api
      - ./storage:/app/storage
      - ./util:/app/util
      - ./data:/app/data
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 100M

  # Ticker Consumer - Real-time ticker data consumer (Hot Path)
  ticker-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: ticker-consumer
    container_name: ticker-consumer
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TICKER_TOPIC: raw_tickers
      TICKER_CONSUMER_GROUP: ticker-consumer-group
      KAFKA_AUTO_OFFSET_RESET: latest
      KAFKA_RECONNECT_BACKOFF_MS: "1000"
      KAFKA_RECONNECT_BACKOFF_MAX_MS: "60000"
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      TICKER_TTL_SECONDS: "60"
      TICKER_SYMBOLS: ${TICKER_SYMBOLS}
      TICKER_WATERMARK_DELAY_MS: "10000"
      TICKER_MAX_FUTURE_MS: "5000"
      TICKER_MAX_TRACKED_SYMBOLS: "100"
      LOG_LEVEL: ${TICKER_LOG_LEVEL:-INFO}
    volumes:
      - ./ingestion:/app/ingestion
      - ./storage:/app/storage
      - ./util:/app/util
    command: python -c "from ingestion.ticker_consumer import main; main()"
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "python", "-c", "from ingestion.ticker_consumer import health_check_main; exit(health_check_main())"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Grafana - Visualization and monitoring dashboards
  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    container_name: grafana
    depends_on:
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      crypto-api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: redis-datasource,marcusolsson-json-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: redis-datasource
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-storage:/var/lib/grafana
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Streamlit Dashboard
  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    hostname: streamlit
    container_name: streamlit
    depends_on:
      crypto-api:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      API_URL: http://crypto-api:8000
    networks:
      - streaming-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres-db-volume:
  postgres-data-volume:
  grafana-storage:
  prometheus-data:
  spark-checkpoints:

networks:
  streaming-network:
    driver: bridge
